<!DOCTYPE html>
<html>
<head>
    <title>conca.com</title>
    <style>
        .hoca
        {
            position: relative;
            width: 100%;
            height: 100vh;


        }
        @keyframes conca {
           0% 
           {
             transform: translate(0px,40px);
           } 
           25%
           {
            transform: translate(600px,140px);
            
           }
           50%
           {
            transform: translate(1300px,300px) rotate(30deg);
         
           }
           65%
           {
            transform: translate(1600px,500px);
           }
              66%
           {
            transform: translate(1600px,500px) scaleX(-1);
           }
           75%
           {
            transform: translate(900px,500px) scaleX(-1);
           }
           76%
           {
            transform: translate(900px,500px)  scaleX(-1); 
           }
           85%
           {
            transform: translate(0px,800px)  scaleX(-1);
           }
            86%
           {
            transform: translate(0px,800px) rotate(-90deg)      ;
           }
           
            99%
           {
            transform: translate(0px,0px)  rotate(-90deg);
           }
           100%
           {
            transform: translate(0px,0px)   ;
           }
           
        }
        .ca 
     {
        animation-name: conca;
        animation-iteration-count: infinite;
        animation-duration: 5s;
        animation-timing-function: linear;
     }
    </style>
</head>
<body>

    <div class="hoca">
        <img class ="ca" src="ca.png" style="position: absolute; height: 200px">
  <img src="nen.png" style="width: 100%;">
   
    </div>

</body>
</html>
